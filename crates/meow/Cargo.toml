[package]
name = "meow"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "The native tool every meowpaw unit's program is a subcommand of"
publish = false
default-run = "paw"

[[bin]]
name = "paw"
path = "src/main.rs"

[features]
default = []
verbs = ["dep:sha2"]
scm = ["dep:regex"]
git = []
record = ["dep:regex"]
github = ["dep:sha2"]
licence = ["dep:regex"]
author = ["dep:regex", "dep:yaml-rust2"]
mise = ["dep:regex"]
gotask = ["dep:regex", "dep:yaml-rust2"]
prose = ["dep:regex"]
# The shared layer every language pack builds on (SPC-1190, ADR-2670).
pack = []
markdown = ["dep:yaml-rust2", "pack"]
rust = ["pack"]
go = ["dep:yaml-rust2", "pack"]
typescript = ["pack"]
python = ["pack"]
csharp = ["pack"]
lua = ["pack"]
unattended = ["dep:sha2"]
loop = ["dep:sha2", "dep:regex"]
interface = ["author", "csharp", "git", "github", "gotask", "licence", "loop", "go", "lua", "markdown", "mise", "prose", "python", "rust", "scm", "typescript", "unattended", "verbs", "record"]

[dependencies]
toml = { version = "1.0", features = ["preserve_order"] }
serde_json = { version = "1", features = ["preserve_order"] }
regex = { version = "1", optional = true }
sha2 = { version = "0.11", optional = true }
yaml-rust2 = { version = "0.13", optional = true }

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "z"
