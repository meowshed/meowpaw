[package]
name = "meow"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "The native tool every meowpaw unit's program is a subcommand of"
publish = false

[features]
default = []
verbs = []
scm = ["dep:regex"]
git = []
record = []

[dependencies]
toml = { version = "0.8", features = ["preserve_order"] }
serde_json = { version = "1", features = ["preserve_order"] }
regex = { version = "1", optional = true }

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "z"
