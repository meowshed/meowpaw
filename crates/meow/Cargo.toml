[package]
name = "meow"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "The native tool every meowpaw unit's program is a subcommand of"
publish = false

[features]
default = []
verbs = ["dep:sha2"]
scm = ["dep:regex"]
git = []
record = ["dep:regex"]
github = ["dep:sha2"]
licence = ["dep:regex"]
author = ["dep:regex", "dep:yaml-rust2"]
mise = ["dep:regex"]
gotask = ["dep:regex", "dep:yaml-rust2"]
prose = ["dep:regex"]
markdown = ["dep:yaml-rust2"]
unattended = ["dep:sha2"]

[dependencies]
toml = { version = "1.0", features = ["preserve_order"] }
serde_json = { version = "1", features = ["preserve_order"] }
regex = { version = "1", optional = true }
sha2 = { version = "0.11", optional = true }
yaml-rust2 = { version = "0.13", optional = true }

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "z"
