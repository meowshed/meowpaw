# What this repository declares to the harness (RES-0261). Each verb is one
# command, run by the shell from the repository's root. typecheck and build
# are left undeclared: this repository has neither, so both report unresolved.

[verbs]
fmt = "mise run fmt-check"
lint = "mise run lint && mise run style && mise run prompts && mise run kernel && mise run standalone && mise run budget"
test = "crates/meow/build-units && python3 -m unittest discover -s plugins/meow-verbs/tests && python3 -m unittest discover -s plugins/meow-scm/tests && python3 -m unittest discover -s plugins/meow-git/tests && python3 -m unittest discover -s plugins/meow-method/tests && python3 -m unittest discover -s plugins/meow-github/tests && plugins/meow-method/bin/paw check && python3 -m unittest tools/test_check_docs.py && python3 tools/check_docs.py && python3 tools/check_index.py && python3 tools/check_links.py && python3 tools/check_subagent_shape.py"

# The commit convention: each type with what it means for a release, the
# subject limit and the trailer every commit carries (CLAUDE.md).
[commits]
subject_limit = 72
trailers = ["Signed-off-by"]

[commits.types]
feat = "minor"
fix = "patch"
spec = "none"
docs = "none"
chore = "none"

# The branch nobody commits to directly, and whether every pushed commit must
# carry a good signature from a key in .github/allowed_signers (CLAUDE.md).
[git]
trunk = "main"
require_signatures = true

# The tracker meow-github projects each approved epic's tasks onto (ADR-1310).
[tracker]
kind = "github"

# Where the record lives, for meow-method's checks (SPC-1070).
[record]
root = "project"
