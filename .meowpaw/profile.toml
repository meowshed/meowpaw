# What this repository declares to the harness (RES-0261). Each verb is one
# command, run by the shell from the repository's root. All five reach the
# native tool in crates/meow through mise.toml's tasks (ADR-1610).

[verbs]
format = "mise run fmt-check && mise run shell-fmt && mise run crate-fmt"
check = "mise run crate-check"
lint = "mise run lint && mise run style && mise run prompts && mise run kernel && mise run standalone && mise run budget && plugins/meow-licence/bin/meow-licence check && plugins/meow-mise/bin/meow-mise check && mise run shell-lint && plugins/meow-markdown/bin/meow-markdown check && mise run crate-lint"
test = "crates/meow/build-units && mise run crate && python3 -m unittest discover -s plugins/meow-checks/tests && python3 -m unittest discover -s plugins/meow-scm/tests && python3 -m unittest discover -s plugins/meow-git/tests && python3 -m unittest discover -s plugins/meow-flow/tests && python3 -m unittest discover -s plugins/meow-github/tests && python3 -m unittest discover -s plugins/meow-licence/tests && python3 -m unittest discover -s plugins/meow-author/tests && python3 -m unittest discover -s plugins/meow-prose/tests && python3 -m unittest discover -s plugins/meow-mise/tests && python3 -m unittest discover -s plugins/meow-gotask/tests && mise exec lychee@0.24.2 -- python3 -m unittest discover -s plugins/meow-markdown/tests && python3 -m unittest discover -s plugins/meow-prose-gate/tests && python3 -m unittest discover -s plugins/meow-unattended/tests && python3 -m unittest discover -s plugins/meow-loop/tests && plugins/meow-flow/bin/paw check && python3 -m unittest tools/test_check_docs.py tools/test_loop.py tools/test_check_release.py tools/test_verb_bindings.py tools/test_shell_verbs.py tools/test_crate_verbs.py tools/test_shipped_agents.py tools/test_marketplace.py tools/test_no_kept_evidence.py tools/test_record_shape.py && python3 tools/check_docs.py && python3 tools/check_index.py && python3 tools/check_links.py && python3 tools/check_subagent_shape.py"
build = "mise run build"

# The commit convention: each type with what it means for a release, the
# subject limit and the trailer every commit carries (CLAUDE.md).
[commits]
subject_limit = 72
trailers = ["Signed-off-by"]

[commits.types]
feat = "minor"
fix = "patch"
spec = "none"
docs = "none"
chore = "none"

# The branch nobody commits to directly, and whether every pushed commit must
# carry a good signature from a key in .github/allowed_signers (CLAUDE.md).
[git]
trunk = "main"
require_signatures = true

# The tracker meow-github projects each approved epic's tasks onto (ADR-1310).
[tracker]
kind = "github"

# Where the record lives, for meow-flow's checks (SPC-1070).
[record]
root = "project"

# The documentation style the implement step writes to (SPC-1090): the writing
# standard meow-prose ships, which CLAUDE.md holds every text to.
[docs]
style = "meow-prose"

# The render target this repository's Markdown is written for, which
# meow-markdown check requires (REQ-2452, ADR-1900).
[markdown]
target = "github"
