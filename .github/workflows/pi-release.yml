# Publishes the Pi packages. The meow binary is built once with every
# feature by the build workflow's full job. The npm tarball carries all six
# platforms' binaries and publishes to npm; the GitHub release archives
# stay as the record of what shipped and as the download source the
# installer names for a git install (ADR-2790, ADR-2800).

name: Pi Release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the releases and the npm packages
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pi-release

jobs:
  build:
    uses: ./.github/workflows/build.yml

  release:
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      MEOW_FULL_VERSION: 0.1.0
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: full-*
          path: bin-full
          merge-multiple: false

      - name: Publish the meow-full release, one binary for every platform
        run: |
          tag="meow-full-v$MEOW_FULL_VERSION"
          mkdir -p dist-full
          # Each full artifact holds <triple>/meow under its own directory.
          for d in bin-full/full-*/; do
            triple=$(basename "$d")
            ext=""
            case $triple in *-windows-*) ext=.exe ;; esac
            cp "$d/$triple/meow$ext" "dist-full/meow-$triple$ext"
          done
          ls dist-full
          (cd dist-full && zip -q -X ../meow-full-$MEOW_FULL_VERSION.zip ./*)
          sha=$(sha256sum "meow-full-$MEOW_FULL_VERSION.zip" | cut -d' ' -f1)
          notes="The one meow binary with every subcommand, built for six platforms. The Pi packages' installers download this archive. SHA-256: \`$sha\`"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "meow-full-$MEOW_FULL_VERSION.zip" --clobber
            gh release edit "$tag" --notes "$notes"
          else
            gh release create "$tag" "meow-full-$MEOW_FULL_VERSION.zip" \
              --target "$GITHUB_SHA" \
              --title "meow-full $MEOW_FULL_VERSION" \
              --notes "$notes"
          fi

      - name: Place the platform binaries in each package
        run: |
          for pkg in packages/meow-*/; do
            for triple in aarch64-apple-darwin x86_64-apple-darwin \
                          aarch64-unknown-linux-musl x86_64-unknown-linux-musl \
                          aarch64-pc-windows-msvc x86_64-pc-windows-msvc; do
              mkdir -p "$pkg/bin/$triple"
              ext=""
              case $triple in *-windows-*) ext=.exe ;; esac
              src=$(find bin-full -path "*dist/$triple/meow$ext" | head -1)
              if [ -n "$src" ]; then
                cp "$src" "$pkg/bin/$triple/meow$ext"
                chmod +x "$pkg/bin/$triple/meow$ext"
              else
                echo "::error::no $triple binary among the build artifacts"
                exit 1
              fi
            done
          done

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org

      - name: Publish each package to npm
        if: inputs.publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for pkg in packages/meow-*/; do
            name=$(jq -r .name "$pkg/package.json")
            version=$(jq -r .version "$pkg/package.json")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already published"
              continue
            fi
            (cd "$pkg" && npm publish --provenance --access public)
          done

      - name: Pack the GitHub release archives
        run: |
          mkdir dist
          printf '| Package | Version | npm | Archive | Bytes | SHA-256 |\n' > dist/notes.md
          printf '| ------- | ------- | --- | ------- | ----- | ------- |\n' >> dist/notes.md
          for pkg in packages/meow-*/; do
            name=$(jq -r .name "$pkg/package.json")
            version=$(jq -r .version "$pkg/package.json")
            short=$(basename "$pkg")
            tag="$short-pi-v$version"
            zip="$short-pi-$version.zip"

            chmod +x "$pkg"/bin/* 2>/dev/null || true
            (cd "$pkg" && zip -q -X "../dist/$zip" -r . \
              -x "bin/*-*/" -x "node_modules/*" -x ".git/*")

            sha=$(sha256sum "dist/$zip" | cut -d' ' -f1)
            bytes=$(wc -c < "dist/$zip")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              state="published"
            else
              state="unpublished"
            fi
            printf '| %s | %s | %s | %s | %s | `%s` |\n' "$name" "$version" "$state" "$zip" "$bytes" "$sha" >> dist/notes.md
            echo "$tag" >> dist/tags
          done
          cat dist/notes.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: pi-release
          path: dist/

      - name: Publish the GitHub release archives
        if: inputs.publish
        run: |
          touch dist/tags
          while read -r tag; do
            short=${tag%-pi-v*}
            version=${tag##*-v}
            zip="${short}-pi-${version}.zip"
            if gh release view "$tag" >/dev/null 2>&1; then
              continue
            fi
            gh release create "$tag" "dist/$zip" --target "$GITHUB_SHA" \
              --title "$short-pi $version" \
              --notes "$(grep "^| @meowshed/$short |" dist/notes.md)" --latest=false
          done < dist/tags