# Publishes the Pi packages. The meow binary is built once with every
# feature by the build workflow's full job and published as the meow-full
# release; each Pi package's installer downloads it at install time, so no
# package archive carries a binary (ADR-2790).

name: Pi Release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the releases; leave it off to build and pack only
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pi-release

jobs:
  build:
    uses: ./.github/workflows/build.yml

  release:
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      MEOW_FULL_VERSION: 0.1.0
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: bin-full-*
          path: bin-full
          merge-multiple: false

      - name: Publish the meow-full release, one binary for every platform
        run: |
          tag="meow-full-v$MEOW_FULL_VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "meow-full $MEOW_FULL_VERSION is already released"
            exit 0
          fi
          mkdir -p dist-full
          for d in bin-full/*/; do
            triple=$(basename "$d")
            # download-artifact keeps one directory per target under it
            find "$d" -name 'meow*' -exec cp {} dist-full/ \; 2>/dev/null || true
          done
          # Each artifact directory holds dist/<triple>/meow; walk that shape.
          rm -rf dist-full && mkdir dist-full
          find bin-full -type f -name 'meow*' | while read -r f; do
            triple=$(dirname "$f" | sed 's|.*/dist/||; s|/[^/]*$||')
            cp "$f" "dist-full/meow-$triple$(case $f in *.exe) echo .exe;; esac)"
          done
          (cd dist-full && zip -q -X ../meow-full-$MEOW_FULL_VERSION.zip ./*)
          sha=$(sha256sum "meow-full-$MEOW_FULL_VERSION.zip" | cut -d' ' -f1)
          gh release create "$tag" "meow-full-$MEOW_FULL_VERSION.zip" \
            --target "$GITHUB_SHA" \
            --title "meow-full $MEOW_FULL_VERSION" \
            --notes "The one meow binary with every subcommand, built for six platforms. The Pi packages' installers download this archive. SHA-256: \`$sha\`"

      - name: Pack each Pi package
        run: |
          mkdir dist
          printf '| Package | Version | Archive | Bytes | SHA-256 |\n' > dist/notes.md
          printf '| ------- | ------- | ------- | ----- | ------- |\n' >> dist/notes.md
          for pkg in packages/meow-*; do
            name=$(jq -r .name "$pkg/package.json")
            version=$(jq -r .version "$pkg/package.json")
            short=$(basename "$pkg")
            tag="$short-pi-v$version"
            zip="$short-pi-$version.zip"

            chmod +x "$pkg"/bin/* 2>/dev/null || true
            (cd "$pkg" && zip -q -X "../dist/$zip" -r . \
              -x "bin/*-*/" -x "node_modules/*" -x ".git/*")

            sha=$(sha256sum "dist/$zip" | cut -d' ' -f1)
            bytes=$(wc -c < "dist/$zip")
            state="new"
            if gh release view "$tag" >/dev/null 2>&1; then
              state="released"
            else
              echo "$tag" >> dist/tags
            fi
            printf '| %s | %s | %s | %s | `%s` |\n' "$name" "$version" "$state" "$bytes" "$sha" >> dist/notes.md
          done
          cat dist/notes.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: pi-release
          path: dist/

      - name: Publish the package releases
        if: inputs.publish
        run: |
          touch dist/tags
          while read -r tag; do
            short=${tag%-pi-v*}
            version=${tag##*-v}
            zip="${short}-pi-${version}.zip"
            gh release create "$tag" "dist/$zip" --target "$GITHUB_SHA" \
              --title "$short-pi $version" --notes "$(grep "^| @meowshed/$short |" dist/notes.md)" --latest=false
          done < dist/tags
