name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          # The version meow-mise was tested on, in its crate: a newer mise
          # changed the trust behaviour its tests hold.
          version: "2026.9.11"
          experimental: true
      # mise installs each stage's tools from GitHub releases, and an anonymous
      # request is limited to 60 an hour, which a run can use up (PR 882).
      - run: mise run all
        env:
          GITHUB_TOKEN: ${{ github.token }}

  attribution:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: No AI attribution in the commits this adds
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          base="$BASE_SHA"
          head="$HEAD_SHA"
          if [ -z "$base" ]; then exit 0; fi
          if git log --format=%B "$base..$head" |
             grep -iE 'co-authored-by.*(claude|anthropic|copilot)|generated with \[|noreply@anthropic'; then
            echo "::error::a commit carries AI attribution; see CLAUDE.md"
            exit 1
          fi
