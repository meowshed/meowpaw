# Builds each unit's binary of the native tool for all six targets (SPC-1080).
# Every target builds under Linux: the musl targets natively, the darwin
# targets through osxcross in a container, and the windows targets through
# cargo-xwin. CI runs it whenever the crate, a launcher or the build changes,
# and the release calls it for the binaries it packs.

name: Build

on:
  workflow_call:
  pull_request:
    paths:
      - crates/**
      - plugins/*/bin/**
      - .github/workflows/build.yml
  push:
    branches: [main]
    paths:
      - crates/**
      - plugins/*/bin/**
      - .github/workflows/build.yml

permissions:
  contents: read

jobs:
  linux:
    name: linux ${{ matrix.target }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
          - { target: x86_64-unknown-linux-musl, os: ubuntu-24.04 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: sudo apt-get install -y musl-tools
      - run: crates/meow/build-units ${{ matrix.target }}
        shell: bash
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build the full binary for every subcommand
        run: |
          cargo build --quiet --release --manifest-path crates/meow/Cargo.toml \
            --all-features --target ${{ matrix.target }} --target-dir target
          mkdir -p dist/${{ matrix.target }}
          cp "target/${{ matrix.target }}/release/meow" "dist/${{ matrix.target }}/meow"
        shell: bash
      - uses: actions/upload-artifact@v7
        with:
          name: bin-${{ matrix.target }}
          path: plugins/*/bin/${{ matrix.target }}/
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: full-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  darwin:
    name: darwin ${{ matrix.target }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: aarch64-apple-darwin
            cc: aa64-clang
            cxx: aa64-clang++
            ldid: ldid_linux_aarch64
            ldid_sha: 0019dfc4b32d63c1392aa264aed2253c1e0c2fb09216f8e2cc269bbfb8bb49b5
          - target: x86_64-apple-darwin
            cc: o64-clang
            cxx: o64-clang++
            ldid: ldid_linux_x86_64
            ldid_sha: 6e9ec33f64545b24b10648c8b3d4c5581763b9a09757168813801b81315bff8f
    runs-on: ubuntu-24.04
    container:
      # osxcross with the macOS SDK, which the darwin targets need to link
      # against; pinned to the major tag, and the tag is what the digest
      # would pin if the supply chain wanted a tighter lock.
      image: joseluisq/rust-linux-darwin-builder:latest
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      AR: llvm-ar
    steps:
      - uses: actions/checkout@v7
      - run: rustup default stable && rustup target add ${{ matrix.target }}
      # A darwin binary built here carries no signature, and macOS kills an
      # unsigned arm64 binary on sight, so the build signs it with ldid. The
      # static binary is fetched from a pinned release and checked against
      # its checksum, because a signing tool is part of the supply chain.
      - name: Install ldid
        run: |
          curl -sSL --fail -o /usr/local/bin/ldid \
            "https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus2/${{ matrix.ldid }}"
          echo "${{ matrix.ldid_sha }}  /usr/local/bin/ldid" | sha256sum -c -
          chmod +x /usr/local/bin/ldid
      - run: crates/meow/build-units ${{ matrix.target }}
        shell: bash
        env:
          RUSTFLAGS: -C link-arg=-undefined dynamic_lookup
      # A binary built under Linux carries no signature, and macOS kills an
      # unsigned arm64 binary on sight; ldid writes the ad-hoc signature the
      # macOS linker writes on a Mac.
      - run: find plugins/*/bin/${{ matrix.target }} -name 'meow*' -exec ldid -S {} +
      - name: Build the full binary for every subcommand
        run: |
          cargo build --quiet --release --manifest-path crates/meow/Cargo.toml \
            --all-features --target ${{ matrix.target }} --target-dir target
          mkdir -p dist/${{ matrix.target }}
          cp "target/${{ matrix.target }}/release/meow" "dist/${{ matrix.target }}/meow"
          ldid -S "dist/${{ matrix.target }}/meow"
        shell: bash
        env:
          RUSTFLAGS: -C link-arg=-undefined dynamic_lookup
      - uses: actions/upload-artifact@v7
        with:
          name: bin-${{ matrix.target }}
          path: plugins/*/bin/${{ matrix.target }}/
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: full-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  windows:
    name: windows ${{ matrix.target }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { target: aarch64-pc-windows-msvc, os: ubuntu-24.04-arm }
          - { target: x86_64-pc-windows-msvc, os: ubuntu-24.04 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # cargo-xwin fetches the Windows SDK from Microsoft's own servers and
      # links the MSVC target from Linux.
      - run: cargo install --locked cargo-xwin
      - run: crates/meow/build-units ${{ matrix.target }}
        shell: bash
      - name: Build the full binary for every subcommand
        run: |
          cargo xwin build --quiet --release --manifest-path crates/meow/Cargo.toml \
            --all-features --target ${{ matrix.target }} --target-dir target
          mkdir -p dist/${{ matrix.target }}
          ext=""
          case ${{ matrix.target }} in *-windows-*) ext=.exe ;; esac
          cp "target/${{ matrix.target }}/release/meow$ext" "dist/${{ matrix.target }}/meow$ext"
        shell: bash
      - uses: actions/upload-artifact@v7
        with:
          name: bin-${{ matrix.target }}
          path: plugins/*/bin/${{ matrix.target }}/
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: full-${{ matrix.target }}
          path: dist/
          if-no-files-found: error