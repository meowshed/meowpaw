# Packs every Claude Code unit whose version has no release yet, and
# publishes each as its own release beside a marketplace file that installs
# every unit from its archive (SPC-1080). The binaries come from the last
# successful Rust Tool run, so a plugin change starts no build (ADR-2810).
# A person runs it by hand; a tag named `<unit>-v<version>` pushed from the
# trunk releases that unit alone. Without `publish` it packs only, and
# leaves the result as a workflow artifact.

name: Claude Release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the releases; leave it off to pack only
        type: boolean
        default: false
  push:
    tags:
      - "meow-*-v*"

permissions:
  contents: read

concurrency:
  group: claude-release

jobs:
  release:
    # The Pi packages' tags name no Claude Code unit, so they run the Pi
    # release and not this one.
    if: ${{ !(startsWith(github.ref, 'refs/tags/') && (startsWith(github.ref_name, 'meow-full-v') || contains(github.ref_name, '-pi-v'))) }}
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      BASE: https://github.com/${{ github.repository }}/releases/download
    steps:
      - uses: actions/checkout@v7
        with:
          # The release check reads every unit's tags and the commits since.
          fetch-depth: 0
      - name: Resolve what to release
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "publish=true" >> "$GITHUB_ENV"
            echo "unit=${GITHUB_REF_NAME%-v*}" >> "$GITHUB_ENV"
          fi
      - name: Find the latest Rust Tool run on the trunk
        run: |
          run_id=$(gh run list --workflow rust-tool.yml --status success --limit 30 \
            --json databaseId,headBranch \
            --jq '[.[] | select(.headBranch == "main")][0].databaseId')
          if [ -z "$run_id" ]; then
            echo "::error::no successful Rust Tool run on main; run the Rust Tool workflow first"
            exit 1
          fi
          echo "rust_run_id=$run_id" >> "$GITHUB_ENV"
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/download-artifact@v8
        with:
          pattern: bin-*
          path: plugins
          merge-multiple: true
          run-id: ${{ env.rust_run_id }}
          github-token: ${{ github.token }}
      - name: Refuse a breaking change the version doesn't show
        run: python3 tools/check_release.py
      - name: Pack the units without a release
        run: |
          mkdir dist
          cp .claude-plugin/marketplace.json dist/marketplace.json
          printf '| Unit | Version | Archive | Bytes | SHA-256 |\n' > dist/notes.md
          printf '| ---- | ------- | ------- | ----- | ------- |\n' >> dist/notes.md
          for name in $(jq -r '.plugins[].name' .claude-plugin/marketplace.json); do
            if [ -n "$unit" ] && [ "$name" != "$unit" ]; then continue; fi
            dir=plugins/$name
            version=$(jq -r .version "$dir/.claude-plugin/plugin.json")
            tag=$name-v$version
            zip=$name-$version.zip
            if gh release view "$tag" >/dev/null 2>&1; then
              gh release download "$tag" --pattern "$zip" --dir dist
              state=released
            else
              chmod +x "$dir"/bin/* "$dir"/bin/*/meow* 2>/dev/null || true
              { git ls-files "$dir"; ls "$dir"/bin/*-*-*/meow* 2>/dev/null || true; } |
                sed 's|^plugins/||' | (cd plugins && zip -q -X "../dist/$zip" -@)
              echo "$tag" >> dist/tags
              state=new
            fi
            sha=$(sha256sum "dist/$zip" | cut -d' ' -f1)
            bytes=$(wc -c < "dist/$zip")
            printf '| %s | %s | %s | %s | `%s` |\n' "$name" "$version" "$state" "$bytes" "$sha" >> dist/notes.md
            # A served entry is an archive, so the platform shows only its own
            # fields before an install; plugin.json is where they are written.
            jq --arg name "$name" --arg url "$BASE/$tag/$zip" --arg sha "$sha" \
              --slurpfile unit "$dir/.claude-plugin/plugin.json" \
              '(.plugins[] | select(.name == $name)) |= (.source = {source: "archive", url: $url, sha256: $sha}
                 | .description = $unit[0].description | .repository = $unit[0].repository
                 | .license = $unit[0].license | .keywords = $unit[0].keywords)' \
              dist/marketplace.json > dist/next.json
            mv dist/next.json dist/marketplace.json
          done
          cat dist/notes.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: dist/
      - name: Publish
        if: inputs.publish || env.publish == 'true'
        run: |
          touch dist/tags
          while read -r tag; do
            name=${tag%-v*}
            version=${tag##*-v}
            gh release create "$tag" "dist/$name-$version.zip" --target "$GITHUB_SHA" \
              --title "$name $version" --notes "$(head -2 dist/notes.md; grep "^| $name |" dist/notes.md)" --latest=false
          done < dist/tags
          notes="$(printf 'Add the marketplace by its address, which serves this file:\n\n```bash\nclaude plugin marketplace add https://meow.retran.me/meowpaw/marketplace.json\n```\n\n' ; cat dist/notes.md)"
          if gh release view marketplace >/dev/null 2>&1; then
            gh release upload marketplace dist/marketplace.json --clobber
            gh release edit marketplace --notes "$notes"
          else
            gh release create marketplace dist/marketplace.json --target "$GITHUB_SHA" \
              --title "Marketplace" --notes "$notes"
          fi
      - name: Tell meow.retran.me a release happened
        if: inputs.publish || env.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.MARKETPLACE_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::MARKETPLACE_DISPATCH_TOKEN is not set, so meow.retran.me still serves the previous marketplace file"
            exit 1
          fi
          gh api repos/retran/meow.retran.me/dispatches -f event_type=meowpaw-release
