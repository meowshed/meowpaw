[launcher.meow-loop]
subcommand = 'loop'
comment = [
  "Where there is none, it reports the run as unresolved and starts nothing,",
  "because a run nobody could start must never read as one that ended.",
]
prologue = '''
  # The binary may sit in another unit, so it is told where this unit's
  # layout is. A layout the caller named wins.
  if [ -z "$MEOW_LAYOUT" ]; then
    MEOW_LAYOUT="$here/../lib/layout.toml"
    export MEOW_LAYOUT
  fi
  # The run's hooks load this unit, whose directory the binary can't derive
  # from its own path where it ships in another unit.
  if [ -z "$MEOW_LOOP_UNIT" ]; then
    MEOW_LOOP_UNIT=$(cd "$here/.." 2>/dev/null && pwd -P)
    export MEOW_LOOP_UNIT
  fi
'''
tail = '''
@REASON@
case "$1" in
guard)
  # A launcher with no binary can't tell which call its program would have let
  # through, so the guard denies every Bash command, Edit and Write it matches
  # and says how to install the binary (ADR-2710).
  cat >/dev/null
  echo "meow-loop: denied $1 because $reason, with this command in a terminal outside the session: $fix" >&2
  exit 2
  ;;
prompt | stop)
  # These two start and end a run and stop no call, and a prompt hook that
  # denies erases what the person typed, so with no binary the session goes on
  # with no run started and none ended.
  cat >/dev/null
  exit 0
  ;;
start | purge)
  echo "unresolved: $reason"
  exit 3
  ;;
*)
  echo "usage: meow-loop start --prompt <file> --until verbs=<stage>[,<stage>...] --iterations <n> --budget-usd <amount> --permission-mode dontAsk [--allowed-tools <rule>]... [--plugin-dir <dir>]..." >&2
  exit 2
  ;;
esac
'''
[launcher.meow-loop.pi]
prologue = '''
'''
tail = '''
@REASON@
case "$1" in
guard)
  # The hook runs on every Bash command, Edit and Write, and a hook that
  # fails blocks them all, so with no binary it lets each through: a write
  # to the hash check, and a start to the refusal under CLAUDECODE.
  cat >/dev/null
  exit 0
  ;;
start)
  echo "unresolved: $reason"
  exit 3
  ;;
*)
  echo "usage: meow-loop start --prompt <file> --until verbs=<stage>[,<stage>...] --iterations <n> --budget-usd <amount> --permission-mode dontAsk [--allowed-tools <rule>]... [--plugin-dir <dir>]..." >&2
  exit 2
  ;;
esac
'''

