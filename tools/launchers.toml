# The facts that differ per unit in its launcher, read by generate_launchers.py.
# A key under [launcher.<unit>.pi] replaces the shared one for the Pi package.

[launcher.meow-author]
subcommand = 'author'
comment = [
  "Where there is none, it reports the material as unchecked, because material",
  "nobody checked must never read as material that passed.",
]
tail = '''
@REASON@
case "$1" in
check)
  echo "meow-author check: unchecked: $reason"
  exit 3
  ;;
*)
  echo "usage: meow-author check [path...]" >&2
  exit 2
  ;;
esac
'''
[launcher.meow-author.pi]
tail = '''
@REASON@
case "$1" in
check)
  echo "meow-author check: unchecked: $reason"
  exit 3
  ;;
cost)
  echo "meow-author cost: unchecked: $reason"
  exit 3
  ;;
*)
  echo "usage: meow-author check [path...] | meow-author cost" >&2
  exit 2
  ;;
esac
'''

[launcher.meow-checks]
subcommand = 'verbs'
comment = [
  "Where there is none, it reports every verb unresolved itself, because a verb",
  "that couldn't run must never read as passed.",
]
tail = '''
verbs="format lint check test build"
@REASON@
case "$1" in
status)
  if [ "$2" = "--json" ]; then
    printf '{"profile": null, "profile_state": "unknown", "error": "%s", "verbs": {' "$reason"
    sep=""
    for verb in $verbs; do
      printf '%s"%s": {"state": "unresolved", "kind": "no interpreter", "detail": "%s"}' "$sep" "$verb" "$reason"
      sep=", "
    done
    printf '}, "ignored": []}\n'
  else
    for verb in $verbs; do
      printf '%-10s unresolved  no interpreter: %s\n' "$verb" "$reason"
    done
  fi
  exit 0
  ;;
revision)
  cat >/dev/null 2>&1
  echo "meow-checks revision: not counted ($reason)"
  exit 0
  ;;
run)
  shift
  if [ $# -eq 0 ]; then
    echo "meow-checks run: name the verbs to run, from: $verbs" >&2
    exit 2
  fi
  summary=""
  for verb in "$@"; do
    printf '== %s: unresolved (no interpreter: %s), not run\n' "$verb" "$reason"
    summary="$summary${summary:+, }$verb unresolved"
  done
  printf '\nsummary: %s\n' "$summary"
  exit 3
  ;;
*)
  echo "usage: meow-checks status [--json] | meow-checks run <verb>..." >&2
  exit 2
  ;;
esac
'''
[launcher.meow-checks.pi]
tail = '''
verbs="format lint check test build"
@REASON@
case "$1" in
status)
  if [ "$2" = "--json" ]; then
    printf '{"profile": null, "profile_state": "unknown", "error": "%s", "verbs": {' "$reason"
    sep=""
    for verb in $verbs; do
      printf '%s"%s": {"state": "unresolved", "kind": "no interpreter", "detail": "%s"}' "$sep" "$verb" "$reason"
      sep=", "
    done
    printf '}, "ignored": []}\n'
  else
    for verb in $verbs; do
      printf '%-10s unresolved  no interpreter: %s\n' "$verb" "$reason"
    done
  fi
  exit 0
  ;;
run)
  shift
  if [ $# -eq 0 ]; then
    echo "meow-checks run: name the verbs to run, from: $verbs" >&2
    exit 2
  fi
  summary=""
  for verb in "$@"; do
    printf '== %s: unresolved (no interpreter: %s), not run\n' "$verb" "$reason"
    summary="$summary${summary:+, }$verb unresolved"
  done
  printf '\nsummary: %s\n' "$summary"
  exit 3
  ;;
*)
  echo "usage: meow-checks status [--json] | meow-checks run <verb>..." >&2
  exit 2
  ;;
esac
'''

[launcher.meow-csharp]
subcommand = 'csharp'
comment = [
  "Where there is none, it reports the repository as unresolved, because a",
  "report nobody could make must never read as one that found nothing.",
]
commands = 'status | bind | check'
state = 'unresolved'
usage = 'meow-csharp status | bind | check'

[launcher.meow-flow]
file = 'paw'
subcommand = 'record'
comment = [
  "Where there is none, it reports the record as not checked, because a record",
  "nobody checked must never read as a clean one.",
]
prologue = '''
  # A layout the caller named wins, because a test or a script pointing at
  # another layout is asking the binary about that layout, not about this one.
  if [ -z "$MEOW_LAYOUT" ]; then
    MEOW_LAYOUT="$here/../lib/layout.toml"
    export MEOW_LAYOUT
  fi
'''
tail = '''
@REASON@
# The session-start hook blocks nothing, so with no binary it says the record
# wasn't checked and how to install the binary, and the session begins
# (SPC-1240).
if [ "$1" = "status" ] && [ "$2" = "--waiting" ]; then
  echo "paw: the record was not checked: $reason, with: $fix"
  exit 0
fi
echo "paw: the record was not checked: $reason"
exit 3
'''
[launcher.meow-flow.pi]
prologue = '''
  MEOW_LAYOUT="$here/../lib/layout.toml"
  export MEOW_LAYOUT
'''
tail = '''
# At the start of a session, say nothing rather than a failure nobody asked about.
if [ "$1" = "status" ] && [ "$2" = "--waiting" ]; then
  exit 0
fi
echo "paw: the record was not checked: no paw executable was found for this machine, $(uname -s 2>/dev/null) on $(uname -m 2>/dev/null); reinstall the unit, which ships one for macOS, Linux and Windows on arm64 and x86_64"
exit 3
'''

[launcher.meow-git]
subcommand = 'git'
comment = [
  "Where there is none, it denies the command and says how to install the",
  "binary, because a guard that lets a call through for a missing binary lets",
  "through the call it exists to stop (ADR-2710).",
]
tail = '''
@REASON@
# A hook that lets a call through for a missing binary lets through the call it
# exists to stop (ADR-2710), so each guard denies and says how to install.
cat >/dev/null 2>&1
echo "meow-git: denied $1 because $reason, with this command in a terminal outside the session: $fix" >&2
exit 2
'''
[launcher.meow-git.pi]
comment = [
  "Where there is none, it reports the checks as unrun and lets the command",
  "through, because blocking every commit for a missing binary would punish the",
  "person for something the pack can't check.",
]
tail = '''
cat >/dev/null 2>&1
echo "meow-git $1: unrun (no paw executable was found for this machine, $(uname -s 2>/dev/null) on $(uname -m 2>/dev/null); reinstall the unit, which ships one for macOS, Linux and Windows on arm64 and x86_64); nothing was checked"
exit 0
'''

[launcher.meow-github]
subcommand = 'github'
comment = [
  "Where there is none, it reports the history as unread, because a history",
  "nobody read must never read as one that holds nothing, and lets the hook's",
  "guard pass every call.",
]
tail = '''
@REASON@
if [ "$1" = "governance-guard" ]; then
  # A launcher with no binary can't tell which call its program would have let
  # through, so the hook denies every Bash call it matches and says how to
  # install the binary (ADR-2710).
  cat >/dev/null
  echo "meow-github: denied $1 because $reason, with this command in a terminal outside the session: $fix" >&2
  exit 2
fi
if [ "$1" = "history" ]; then
  echo "meow-github history: unread ($reason); nothing was read"
  exit 3
fi
echo "usage: meow-github history [--wait] [<owner>/<name>] | project <decision|defect> [--check] [--wait] [<owner>/<name>] | sync <decision|defect> [--check] [--wait] [<owner>/<name>] | upgrade [--check] [--wait] [<owner>/<name>] | governance-guard" >&2
exit 2
'''
[launcher.meow-github.pi]
tail = '''
@REASON@
if [ "$1" = "governance-guard" ]; then
  # The hook runs on every Bash call, and a hook that fails blocks them all,
  # so with no binary it lets every call through to the person's own rules.
  cat >/dev/null
  exit 0
fi
if [ "$1" = "history" ]; then
  echo "meow-github history: unread ($reason); nothing was read"
  exit 3
fi
echo "usage: meow-github history [--wait] [<owner>/<name>] | project <decision|defect> [--check] [--wait] [<owner>/<name>] | sync <decision|defect> [--check] [--wait] [<owner>/<name>] | upgrade [--check] [--wait] [<owner>/<name>] | governance-guard" >&2
exit 2
'''

