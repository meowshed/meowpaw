schema_version: "1"
name: route-plain-words
description: A request in plain words for a change a decision governs, which the router should route full.
tags: [route]
runs: 3
expected_outcome: The router's reply routes full, and its reason names a path or an identifier in the repository.
context:
  scaffold_script: ../this-repository.sh
execution:
  max_turns: 20
  prompt: |
    Dispatch the meow-flow:router agent in the foreground on the request
    below, passing it the request as written, and print its reply verbatim
    with nothing before it. Do no other work on the request.

    <request>
    Could the verbs also pick up the recipes in a justfile, the way they already read tasks from mise?
    </request>
