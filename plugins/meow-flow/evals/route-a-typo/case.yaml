schema_version: "1"
name: route-a-typo
description: A request to fix a typo, which the session should route none and report before the edit.
tags: [route]
runs: 3
expected_outcome: The session dispatches the router first, reports the route none and its reason before any write, then fixes the typo.
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 20
  prompt: |
    Fix the typo in docs/troubleshooting.md: its first sentence says each entry strats from the message a unit prints.
