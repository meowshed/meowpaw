schema_version: "1"
name: route-overridden
description: A route none given after the session routed a request full, which should change the route with no further question.
tags: [route]
runs: 3
expected_outcome: The session reports the route as none, names the full route the router gave, and proceeds to the work with no question.
context:
  scaffold_script: scaffold.sh
  history_file: history.jsonl
execution:
  max_turns: 15
  prompt: |
    route none
