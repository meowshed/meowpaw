schema_version: "1"
name: route-reduced-unauthorised
description: A route reduced given with new work no approved record authorises, which the session should report as full and say why.
tags: [route]
runs: 3
expected_outcome: The session reports full, the reduced the person gave, and that no approved record authorises the work.
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 15
  prompt: |
    route reduced. Add a --json flag to paw status that prints the chain's state as JSON.
