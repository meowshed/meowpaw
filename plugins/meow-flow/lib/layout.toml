# The record's layout, as CLAUDE.md states it and SPC-1070 reads it: for each
# kind, where its files live under the record's root, the front matter it
# requires, the statuses it may store, the file that indexes it, and the
# sections it must carry. Paths are relative to the root.

# Every artifact carries these, whatever its kind.
fields = ["id", "artifact", "status", "revised"]

# The front matter fields whose values name other artifacts.
relations = ["elaborates", "addresses", "postpones", "supersedes", "realises", "epic", "bug", "closes", "states", "violates", "prompted-by", "folded-into"]

# Per kind: `optional_fields` it may carry and no check requires (ADR-2630),
# `sections` every record carries, `draft_sections` a draft carries
# as well, `first_section` it opens with, `required_values` fields it must
# fill, `forbidden_fields` it must not carry, and the named checks of `rules`
# for every record and `draft_rules` for drafts only (ADR-1140). A rule the
# approved record already breaks applies to drafts, because an approved record
# is frozen.

# Phrases that name an earlier version, which a specification doesn't carry
# because version control keeps the history (ADR-2590). A new way of saying
# "earlier" is one line here.
history_phrases = ["previously", "no longer", "used to", "an earlier version", "was replaced"]

# A file with this name is an index, and indexes are checked as indexes.
index_name = "README.md"

# Names the record has retired, each with what replaced it (ADR-1240). A
# retired name is never reused, because reuse gives every old record carrying
# it a new meaning and nothing fails; the check refuses it in a record and in
# a kind below.
[retired.fields]
unit = "the unit of work is named by the relations the record carries"
checked-at = "no verification is recorded; a requirement closes with the record that names it (ADR-2300)"

# Sections the record has retired, reported wherever one is still carried.
[retired.sections]
Cover = "a plan step's tests land first in a commit of their own in the pull request, and nothing in the record keeps them (ADR-2300)"
Verified = "no verification is recorded; a decision closes with its pull request (ADR-2300)"
"Open review findings" = "no agent reviews a record, so none leaves findings in it (ADR-2300)"

[retired.statuses]
proposed = "replaced by draft"
current = "replaced by live"

[[kind]]
name = "vision"
artifact = "vision"
file = "vision.md"
statuses = ["live"]
# A vision states who it is for, how its goals rank, what it will not do and
# its live risks, carries no date or restated requirement, and fits one
# sitting's reading (ADR-2580).
sections = ["Who it is for", "Quality goals", "What it will not do", "Risks"]
rules = ["vision-no-date", "vision-no-obligation", "vision-length"]

[[kind]]
name = "onboarding"
artifact = "onboarding"
file = "onboarding.md"
statuses = ["draft", "approved", "superseded"]
sections = ["Verbs", "Conventions", "Documents", "Gaps", "Adoption"]
first_section = "Verbs"
rules = ["adoption-in-steps"]

[[kind]]
name = "specification"
artifact = "spec"
prefix = "SPC"
dir = "specs"
fields = ["states"]
statuses = ["live"]
index = "README.md"
sections = ["Scope", "Boundary", "Behaviour", "Failure paths"]
rules = ["spec-no-history"]

[[kind]]
name = "research"
artifact = "research"
prefix = "RES"
dir = "research"
statuses = ["draft", "approved", "withdrawn", "rejected", "superseded"]
index = "research/RES-0001-synthesis.md"
sections = ["Summary", "Method", "Conclusions", "Sources"]
first_section = "Summary"
draft_rules = ["sources-dated", "cites-no-requirement"]
rules = ["prompted-by-defect", "withdrawn-names-record"]

[[kind]]
name = "requirement"
artifact = "requirement"
prefix = "REQ"
dir = "requirements"
fields = ["topic", "class", "verification", "elaborates"]
statuses = ["draft", "approved", "withdrawn", "rejected", "superseded"]
index = "requirements/README.md"
forbidden_fields = ["priority", "owner", "difficulty"]
draft_rules = ["judgement-verifier", "one-obligation", "stands-alone", "no-negated-requirement"]
rules = ["prompted-by-defect", "verification-kind", "withdrawn-names-record"]

[[kind]]
name = "decision"
artifact = "adr"
prefix = "ADR"
dir = "adrs"
fields = ["addresses"]
optional_fields = ["concerns", "issue", "projected", "tracked", "pr"]
statuses = ["draft", "approved", "done", "withdrawn", "rejected", "superseded"]
index = "adrs/README.md"
sections = ["Decision", "Why", "Alternatives", "What it costs", "What would reverse it", "Consequences"]
draft_sections = ["How I will know it was realised", "What this does not settle"]
rules = ["alternatives-why-lost", "addresses-or-postpones", "prompted-by-defect", "withdrawn-names-record", "concerns-framed", "plan-where-work"]

# The two kinds ADR-3090 retired: read and cited from the archive, and never
# written, so `paw new` refuses them and no rule reads them. The relations stay
# in `relations` above because archived records carry them.
[[kind]]
name = "epic"
artifact = "epic"
prefix = "EPC"
dir = "archive/epics"
archived = true
fields = []
statuses = ["draft", "approved", "done", "withdrawn", "rejected", "superseded"]

[[kind]]
name = "task"
artifact = "task"
prefix = "TSK"
dir = "archive/tasks"
archived = true
fields = []
statuses = ["draft", "approved", "done", "withdrawn", "rejected", "superseded"]

[[kind]]
name = "defect"
artifact = "bug"
prefix = "BUG"
dir = "bugs"
# `violates` is left out where no requirement covers the defect yet, as the
# defect template says, so it isn't required.
fields = ["severity", "found"]
optional_fields = ["issue", "projected", "tracked", "pr"]
statuses = ["draft", "approved", "done", "withdrawn", "rejected", "superseded"]
index = "README.md"
sections = ["Reproduction", "What the system does", "What it should do, and why", "Triage", "Closed by"]
forbidden_fields = ["priority", "milestone", "parent", "project", "sprint", "iteration", "label", "labels"]
# `enters` names the step a defect enters at, required once its Triage is
# written, which is a draft rule so defects approved before ADR-1440 keep the
# rules they were approved under.
rules = ["enters-fits", "rejected-says-why", "closed-names-check", "withdrawn-names-record"]
draft_rules = ["enters-after-triage", "plan-where-implement"]

[[kind]]
name = "insight"
artifact = "insight"
prefix = "INS"
dir = "insights"
statuses = ["draft", "approved", "withdrawn", "rejected", "superseded"]
sections = ["Evidence", "What looked right", "The pattern"]
rules = ["title-states-claim", "evidence-measured", "ends-with-pattern", "withdrawn-names-record"]
