# The Claude Code version this unit needs (REQ-1736). Claude Code's plugin
# manifest has no field for a minimum platform version, so the unit states it
# here: the version the runner packs were last tested on, 2026-09-27, which
# this unit's program shares a crate with.
claude_code = "2.1.280"

# The layer of the harness this unit ships in (SPC-1080 "Each unit is a
# plugin"): it wraps the Rust tooling a repository may leave out.
layer = "pack"

# The units this one needs (REQ-1482), read from what it runs: its launcher
# finds the shared binary meow-core ships, and nothing else it runs reaches
# another unit's files.
units = ["meow-core"]

# The range of meow-core versions this pack works with (REQ-2998). The
# launcher contract and the `paw` subcommands it calls are unchanged across
# 0.9.x; the tight range says the pack is coupled to them.
kernel = "0.9"
