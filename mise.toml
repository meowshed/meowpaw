# The repository's own gate. `meow-mise` reads these tasks to resolve the verbs.

[tools]
claude = "latest"
markdownlint-cli2 = "latest"
"npm:prettier" = "latest"
python = "3.14"
rust = { version = "1.98", components = "rustfmt,clippy" }
shellcheck = "0.11.0"
shfmt = "3.14.1"

[tasks.fmt]
description = "Bring Markdown, the native tool's code and the shipped shell to canonical form"
run = "prettier --write '**/*.md' && cargo fmt --manifest-path crates/meow/Cargo.toml && shfmt -i 2 -w $(shfmt -f plugins crates/meow)"

[tasks.fmt-check]
description = "Check Markdown formatting without changing anything"
run = "prettier --check '**/*.md'"

[tasks.lint]
description = "Lint Markdown"
run = "markdownlint-cli2 '**/*.md'"

[tasks.style]
description = "Check every output style the harness ships"
run = "python3 tools/check_style.py"

[tasks.prompts]
description = "Check every shipped prompt with meow-author, the check the harness ships"
run = "cargo run --quiet --release --manifest-path crates/meow/Cargo.toml --target-dir target/author --no-default-features --features author -- author check"

[tasks.kernel]
description = "Check the kernel names no unit outside it"
run = "python3 tools/check_kernel.py"

[tasks.standalone]
description = "Check no unit reaches outside its own directory"
run = "python3 tools/check_standalone.py && python3 -m unittest tools/test_check_standalone.py"

[tasks.budget]
description = "Check every unit stays within the budget it states for every turn"
run = "cargo run --quiet --release --manifest-path crates/meow/Cargo.toml --target-dir target/author --no-default-features --features author -- author cost"

[tasks.build]
description = "Build each unit's binary of the native tool for this machine"
run = "crates/meow/build-units"

[tasks.shell-fmt]
description = "Check every shell file the units ship is in shfmt's form"
run = 'files=$(shfmt -f plugins crates/meow) && test -n "$files" && shfmt -i 2 -d $files'

[tasks.shell-lint]
description = "Lint every shell file the units ship with shellcheck"
run = 'files=$(shfmt -f plugins crates/meow) && test -n "$files" && shellcheck $files'

[tasks.crate-check]
description = "Type-check the native tool with every feature and target"
run = "cargo check --quiet --manifest-path crates/meow/Cargo.toml --all-features --all-targets"

[tasks.crate-fmt]
description = "Check the native tool's code is in the formatter's form"
run = "cargo fmt --manifest-path crates/meow/Cargo.toml --check"

[tasks.crate-lint]
description = "Lint the native tool with clippy, every feature and target, denying warnings"
run = "cargo clippy --quiet --manifest-path crates/meow/Cargo.toml --all-features --all-targets -- -D warnings"

[tasks.crate]
description = "Run the native tool's own tests"
run = "cargo test --quiet --manifest-path crates/meow/Cargo.toml --all-features"

[tasks.eval]
description = "Measure every unit on real models, by hand: it costs money, so `all` never runs it"
run = "python3 tools/loop.py plugins/*/"

[tasks.all]
description = "The full gate, as CI runs it"
depends = ["fmt-check", "lint", "style", "prompts", "kernel", "standalone", "budget", "shell-fmt", "shell-lint", "crate-fmt", "crate-lint", "crate-check", "crate"]
