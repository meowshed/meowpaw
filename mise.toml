# The repository's own gate. `meow-mise` reads these tasks to resolve the stages.

[tools]
claude = "latest"
markdownlint-cli2 = "latest"
"npm:prettier" = "latest"
python = "3.14"
rust = { version = "1.99", components = "rustfmt,clippy" }
shellcheck = "0.11.0"
shfmt = "3.14.1"
task = "3.53.1"

[tasks.fmt]
description = "Bring Markdown, the native tool's code and the shipped shell to canonical form"
run = "prettier --write '**/*.md' && cargo fmt --manifest-path crates/meow/Cargo.toml && shfmt -i 2 -w $(shfmt -f plugins crates/meow)"

[tasks.fmt-check]
description = "Check Markdown formatting without changing anything"
run = "prettier --check '**/*.md'"

[tasks.lint]
description = "Lint Markdown"
run = "markdownlint-cli2 '**/*.md'"

[tasks.style]
description = "Check every output style the harness ships"
run = "python3 tools/check_style.py"

[tasks.prompts]
description = "Check every shipped prompt with meow-author, the check the harness ships"
run = "cargo run --quiet --release --manifest-path crates/meow/Cargo.toml --target-dir target/author --no-default-features --features author -- author check"

[tasks.kernel]
description = "Check the kernel names no unit outside it"
run = "python3 tools/check_kernel.py"

[tasks.standalone]
description = "Check no unit reaches outside its own directory"
run = "python3 tools/check_standalone.py && python3 -m unittest tools/test_check_standalone.py"

[tasks.budget]
description = "Check every unit stays within the budget it states for every turn"
run = "cargo run --quiet --release --manifest-path crates/meow/Cargo.toml --target-dir target/author --no-default-features --features author -- author cost"

[tasks.build]
description = "Build each unit's binary of the native tool for this machine"
run = "crates/meow/build-units"

[tasks.licence]
description = "Check every file carries the licensing the corpus declares"
depends = ["build"]
run = "plugins/meow-licence/bin/meow-licence check"

[tasks.shell-fmt]
description = "Check every shell file the units ship is in shfmt's form"
run = 'files=$(shfmt -f plugins crates/meow) && test -n "$files" && shfmt -i 2 -d $files'

[tasks.shell-lint]
description = "Lint every shell file the units ship with shellcheck"
run = 'files=$(shfmt -f plugins crates/meow) && test -n "$files" && shellcheck $files'

[tasks.crate-check]
description = "Type-check the native tool with every feature and target"
run = "cargo check --quiet --manifest-path crates/meow/Cargo.toml --all-features --all-targets"

[tasks.crate-fmt]
description = "Check the native tool's code is in the formatter's form"
run = "cargo fmt --manifest-path crates/meow/Cargo.toml --check"

[tasks.crate-lint]
description = "Lint the native tool with clippy, every feature and target, denying warnings"
run = "cargo clippy --quiet --manifest-path crates/meow/Cargo.toml --all-features --all-targets -- -D warnings"

[tasks.crate]
description = "Run the native tool's own tests"
run = "cargo test --quiet --manifest-path crates/meow/Cargo.toml --all-features"

[tasks.eval]
description = "Measure every unit on real models, by hand: it costs money, so `all` never runs it"
run = "python3 tools/loop.py plugins/*/"

[tasks.test-crate]
description = "Run the native tool's own tests, after the units are built"
depends = ["build"]
run = "mise run crate"

[tasks.test-checks]
description = "Run the tests of meow-checks"
depends = ["build"]
run = "python3 -m unittest discover -s plugins/meow-checks/tests"

[tasks.test-scm]
description = "Run the tests of meow-scm"
depends = ["build"]
run = "python3 -m unittest discover -s plugins/meow-scm/tests"

[tasks.test-git]
description = "Run the tests of meow-git"
depends = ["build"]
run = "python3 -m unittest discover -s plugins/meow-git/tests"

[tasks.test-flow]
description = "Run the tests of meow-flow"
depends = ["build"]
run = "python3 -m unittest discover -s plugins/meow-flow/tests"

[tasks.test-github]
description = "Run the tests of meow-github"
depends = ["build"]
run = "python3 -m unittest discover -s plugins/meow-github/tests"

[tasks.test-licence]
description = "Run the tests of meow-licence"
depends = ["build"]
run = "python3 -m unittest discover -s plugins/meow-licence/tests"

[tasks.test-author]
description = "Run the tests of meow-author"
depends = ["build"]
run = "python3 -m unittest discover -s plugins/meow-author/tests"

[tasks.test-prose]
description = "Run the tests of meow-prose"
depends = ["build"]
run = "python3 -m unittest discover -s plugins/meow-prose/tests"

[tasks.test-mise]
description = "Run the tests of meow-mise"
depends = ["build"]
run = "python3 -m unittest discover -s plugins/meow-mise/tests"

[tasks.test-gotask]
description = "Run the tests of meow-gotask"
depends = ["build"]
run = "python3 -m unittest discover -s plugins/meow-gotask/tests"

[tasks.test-markdown]
description = "Run the tests of meow-markdown"
depends = ["build"]
run = "mise exec lychee@0.24.2 -- python3 -m unittest discover -s plugins/meow-markdown/tests"

[tasks.test-prose-gate]
description = "Run the tests of meow-prose-gate"
depends = ["build"]
run = "python3 -m unittest discover -s plugins/meow-prose-gate/tests"

[tasks.test-unattended]
description = "Run the tests of meow-unattended"
depends = ["build"]
run = "python3 -m unittest discover -s plugins/meow-unattended/tests"

[tasks.test-loop]
description = "Run the tests of meow-loop"
depends = ["build"]
run = "python3 -m unittest discover -s plugins/meow-loop/tests"

[tasks.test-record]
description = "Check the record"
depends = ["build"]
run = "plugins/meow-flow/bin/paw check"

[tasks.test-tools]
description = "Run the tests and the checks of tools/"
depends = ["build"]
run = """python3 -m unittest tools/test_check_docs.py tools/test_loop.py tools/test_check_release.py tools/test_verb_bindings.py tools/test_shell_verbs.py tools/test_crate_verbs.py tools/test_shipped_agents.py tools/test_marketplace.py tools/test_no_kept_evidence.py tools/test_record_shape.py tools/test_check_community.py tools/test_trunk_gate.py tools/test_threat_model.py tools/test_check_workflows.py tools/test_check_terms.py && python3 tools/check_docs.py && python3 tools/check_index.py && python3 tools/check_links.py && python3 tools/check_subagent_shape.py && python3 tools/check_community.py && python3 tools/check_workflows.py && python3 tools/check_terms.py && python3 tools/check_gate_covers_verbs.py"""

[tasks.test]
description = "Run every unit's tests, the record's check and the repository's own checks, each as a task of its own"
depends = ["test-crate", "test-checks", "test-scm", "test-git", "test-flow", "test-github", "test-licence", "test-author", "test-prose", "test-mise", "test-gotask", "test-markdown", "test-prose-gate", "test-unattended", "test-loop", "test-record", "test-tools"]

[tasks.all]
description = "The full gate, as CI runs it"
depends = ["fmt-check", "shell-fmt", "crate-fmt", "lint", "style", "prompts", "kernel", "standalone", "budget", "licence", "mise-check", "markdown", "shell-lint", "crate-lint", "crate-check", "test", "build"]

[tasks.mise-check]
description = "Check the profile's stages name the tasks mise declares"
depends = ["build"]
run = "plugins/meow-mise/bin/meow-mise check"

[tasks.markdown]
description = "Check every shipped unit with meow-markdown, the check the unit ships"
depends = ["build"]
run = "plugins/meow-markdown/bin/meow-markdown check"
